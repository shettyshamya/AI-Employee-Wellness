[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-employee-wellness"
version = "1.0.0"
description = "AI-powered employee wellness analysis and recommendation system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets",
    "nltk",
    "numpy",
    "pandas",
    "PyMuPDF",
    "python-docx",
    "reportlab",
    "scikit-learn",
    "streamlit",
    "torch",
    "transformers",
    "vaderSentiment",
]

[project.scripts]
wellness-pipeline = "src.wellness_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
